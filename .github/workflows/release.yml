name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      # Release signing (optional). Add these repository secrets:
      #   ANDROID_KEYSTORE_BASE64  base64 of the .jks keystore
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APKs are signed with the debug key (see README).
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; APKs will be signed with the debug key."
          fi

      - name: Build release APKs (split per ABI)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${VERSION%%+*}"
          flutter build apk --release --split-per-abi --build-name="$NAME" --build-number="$GITHUB_RUN_NUMBER"
          flutter build apk --release --build-name="$NAME" --build-number="$GITHUB_RUN_NUMBER"

      - run: flutter build web --release

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          TAG="$GITHUB_REF_NAME"
          for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/flutter-apk/app-release.apk; do
            base="$(basename "$f" .apk)"
            out="dist/tabriz-metro-${TAG}-${base#app-}.apk"
            cp "$f" "$out"
          done
          (cd build/web && zip -qr "../../dist/tabriz-metro-${TAG}-web.zip" .)
          cd dist
          for f in *.apk *.zip; do sha256sum "$f" > "$f.sha256"; done
          sha256sum *.apk *.zip > checksums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
